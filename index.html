<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uzair's Bookmarks Manager</title>
    <meta name="description"
        content="A clean, modern, and fully responsive web application to save, organize, and manage website bookmarks.">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon_io/favicon-16x16.png">
    <link rel="manifest" href="favicon_io/site.webmanifest">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Navbar -->
    <header class="navbar">
        <div class="nav-container">
            <h3 class="logo">
                <img src="favicon_io/favicon-32x32.png" alt="Logo" width="28" height="28">
                Bookmarks
            </h3>
            <div class="nav-controls">
                <div class="search-bar">
                    <input type="text" id="searchInput" placeholder="Search...">
                    <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </div>
                <button id="themeToggle" class="icon-btn" aria-label="Toggle Dark Mode" title="Toggle Dark Mode">
                    <svg id="moonIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                    <svg id="sunIcon" style="display:none;" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                </button>
                <button id="addBtn" class="primary-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    <span>Add Bookmark</span>
                </button>
            </div>
        </div>
    </header>

    <main class="container">
        <!-- Sidebar / Filter Bar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Categories</h2>
            </div>
            <ul class="category-list" id="categoryList">
                <li><button class="category-btn active" data-category="All">All</button></li>
            </ul>

            <div class="sidebar-actions">
                <button id="exportBtn" class="secondary-btn">Export JSON</button>
                <label for="importInput" class="secondary-btn file-label">Import JSON</label>
                <input type="file" id="importInput" accept=".json" style="display:none;">
            </div>
        </aside>

        <!-- Bookmarks Grid -->
        <section class="content">
            <div id="bookmarksGrid" class="bookmarks-grid">
                <!-- Bookmarks will be injected here -->
            </div>
            <div id="emptyState" class="empty-state" style="display: none;">
                <div class="empty-icon">📂</div>
                <h3>No bookmarks found</h3>
                <p>Try adding a new bookmark or changing your search filters.</p>
            </div>
        </section>
    </main>

    <!-- Add/Edit Modal -->
    <div id="bookmarkModal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">Add Bookmark</h2>
                <button class="close-btn" id="closeModalBtn">&times;</button>
            </div>
            <form id="bookmarkForm">
                <input type="hidden" id="bookmarkId">
                <div class="form-group">
                    <label for="title">Title *</label>
                    <input type="text" id="title" required placeholder="e.g. OpenAI">
                </div>
                <div class="form-group">
                    <label for="url">URL *</label>
                    <input type="url" id="url" required placeholder="https://openai.com">
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <input type="text" id="category" placeholder="e.g. AI" list="categoryOptions">
                    <datalist id="categoryOptions">
                        <!-- Options injected dynamically -->
                    </datalist>
                </div>
                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" rows="3" placeholder="Brief description of the website..."></textarea>
                </div>
                <div class="modal-footer">
                    <button type="button" class="secondary-btn" id="cancelModalBtn">Cancel</button>
                    <button type="submit" class="primary-btn" id="saveBookmarkBtn">Save Bookmark</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="deleteModal" class="modal-overlay">
        <div class="modal delete-modal">
            <div class="modal-header">
                <h2>Delete Bookmark?</h2>
            </div>
            <p>Are you sure you want to delete this bookmark? This action cannot be undone.</p>
            <div class="modal-footer">
                <button class="secondary-btn" id="cancelDeleteBtn">Cancel</button>
                <button class="danger-btn" id="confirmDeleteBtn">Delete</button>
            </div>
        </div>
    </div>

    <!-- Toast Notifications Container -->
    <div id="toastContainer" class="toast-container"></div>

    <script src="script.js"></script>
</body>

</html>
